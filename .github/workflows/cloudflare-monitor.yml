name: Connect GitHub read access without changing cron
on:
  workflow_dispatch:
    inputs:
      setup_test:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: leadly-cloudflare-monitor-deploy
  cancel-in-progress: false
jobs:
  publish-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Workers client
        run: npm install --prefix "$RUNNER_TEMP/leadly-monitor-tools" --no-save --ignore-scripts --package-lock=false wrangler@4.151.3
      - name: Verify GitHub read access and publish through the reviewed secret writer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEADLY_MONITOR_GITHUB_TOKEN: ${{ secrets.LEADLY_MONITOR_GITHUB_TOKEN }}
        run: |
          export LEADLY_WRANGLER_BIN="$RUNNER_TEMP/leadly-monitor-tools/node_modules/wrangler/bin/wrangler.js"
          node ops/monitor/cloudflare/publish-auth-once.cjs
