name: Publish LEADLY code without changing cron
on:
  workflow_dispatch:
    inputs:
      setup_test:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: leadly-cloudflare-monitor-deploy
  cancel-in-progress: false
jobs:
  publish-code:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Workers client
        run: npm install --prefix "$RUNNER_TEMP/leadly-monitor-tools" --no-save --ignore-scripts --package-lock=false wrangler@4.151.3
      - name: Update code through versions while preserving the existing cron and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export LEADLY_WRANGLER_BIN="$RUNNER_TEMP/leadly-monitor-tools/node_modules/wrangler/bin/wrangler.js"
          node ops/monitor/cloudflare/publish-code-once.cjs
