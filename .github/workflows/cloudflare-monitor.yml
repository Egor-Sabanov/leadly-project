name: Diagnose Cloudflare backup metadata access
on:
  workflow_dispatch:
    inputs:
      setup_test:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: leadly-cloudflare-monitor-observe
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned log client
        run: npm install --prefix "$RUNNER_TEMP/leadly-monitor-tools" --no-save --ignore-scripts --package-lock=false wrangler@4.151.3
      - name: Probe metadata in a private temporary Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export LEADLY_WRANGLER_BIN="$RUNNER_TEMP/leadly-monitor-tools/node_modules/wrangler/bin/wrangler.js"
          node ops/monitor/cloudflare/probe.cjs
